<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Proposal Drafts Review</title>
<style>
:root { --bg: #fff; --ink: #1f1d1a; --ink2: #47443f; --dim: #7a756c; --line: #e6e2db; --soft: #f5f3ef;
  --accent: #2a6fd6; --ok: #1f9d63; --mid: #b8761a; --bad: #c63b3b; --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font: 16px/1.55 var(--sans); }
.top { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .in { max-width: 780px; margin: 0 auto; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.top b { font-size: 15px; }
.top span { color: var(--dim); font-size: 14px; white-space: nowrap; }
main { max-width: 780px; margin: 0 auto; padding: 24px 16px 130px; }
h1 { font-size: clamp(26px, 4.4vw, 36px); line-height: 1.18; margin: 8px 0 14px; letter-spacing: -.01em; }
h2 { font-size: clamp(20px, 3vw, 24px); line-height: 1.25; margin: 2px 0 10px; }
h3 { font-size: 12.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--dim); margin: 22px 0 8px; }
.kicker { font-size: 12.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--dim); }
.lede { color: var(--ink2); font-size: 17px; margin: 0 0 12px; }
.steps { padding-left: 22px; color: var(--ink2); font-size: 16.5px; }
.steps li { margin: 6px 0; }
.small { color: var(--dim); font-size: 13.5px; }
details.post { margin: 4px 0 6px; }
details.post summary { cursor: pointer; color: var(--accent); font-weight: 600; }
details.post .text { white-space: pre-wrap; background: var(--soft); border-radius: 10px; padding: 12px; margin-top: 8px; font-size: 14.5px; color: var(--ink2); max-height: 420px; overflow: auto; }
.excerpt { color: var(--dim); font-size: 14px; margin: 0 0 16px; }
.letter { white-space: pre-wrap; font-size: 16.5px; line-height: 1.62; border-left: 3px solid var(--accent); padding: 2px 0 2px 16px; overflow-wrap: anywhere; }
.qa { margin: 0 0 12px; }
.qa .q { font-weight: 650; margin: 0 0 3px; }
.qa .a { margin: 0; color: var(--ink2); }
.fb { background: var(--soft); border-radius: 14px; padding: 16px; margin-top: 24px; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
.choices button { font: 600 14.5px var(--sans); padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; min-height: 42px; }
.choices button[aria-pressed="true"][data-v="send"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.choices button[aria-pressed="true"][data-v="edit"] { background: var(--mid); border-color: var(--mid); color: #fff; }
.choices button[aria-pressed="true"][data-v="no"] { background: var(--bad); border-color: var(--bad); color: #fff; }
label { font-weight: 600; font-size: 14.5px; display: block; margin-bottom: 6px; }
textarea, input[type=text] { width: 100%; font: 15px/1.45 var(--sans); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { min-height: 80px; resize: vertical; }
.marks { list-style: none; padding: 0; margin: 10px 0 18px; }
.marks li { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); }
.marks a { color: var(--ink); text-decoration: none; flex: 1; }
.marks a:hover { text-decoration: underline; }
.tag { font-size: 13px; font-weight: 700; white-space: nowrap; }
.tag.send { color: var(--ok); } .tag.edit { color: var(--mid); } .tag.no { color: var(--bad); } .tag.none { color: var(--dim); font-weight: 500; }
.big { font: 700 16px var(--sans); background: var(--ink); color: #fff; border: 0; border-radius: 12px; padding: 13px 20px; cursor: pointer; min-height: 48px; }
.done { color: var(--ok); font-weight: 600; margin-left: 10px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.nav .in { max-width: 780px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.nav button.step { font: 600 15px var(--sans); border-radius: 10px; padding: 10px 16px; min-height: 44px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.nav button.step.next { background: var(--ink); color: #fff; border-color: var(--ink); }
.nav button.step:disabled { opacity: .35; cursor: default; }
.dots { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; }
.dots button { width: 12px; height: 12px; border-radius: 50%; border: 0; padding: 0; background: var(--line); cursor: pointer; }
.dots button.send { background: var(--ok); } .dots button.edit { background: var(--mid); } .dots button.no { background: var(--bad); }
.dots button[aria-current="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
/* Phones: the 12 dots stay on one row between Back and Next. */
@media (max-width: 480px) { .dots { gap: 5px; } .dots button { width: 9px; height: 9px; } .nav button.step { padding: 10px 12px; } }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="top"><div class="in"><b>Proposal drafts</b><span id="where"></span></div></div>
<main id="slide" tabindex="-1"></main>
<nav class="nav" aria-label="Slides"><div class="in">
  <button class="step" id="back" type="button">‹ Back</button>
  <div class="dots" id="dots"></div>
  <button class="step next" id="next" type="button">Next ›</button>
</div></nav>
<script id="data" type="application/json">[{"p": 1, "title": "Google Ads + Landing Page Audit for Free-Trial Subscription App", "post": "I run FedVest (fedvest.app), a retirement and personal finance app built for U.S. federal employees. It covers FERS pensions, TSP projections, FEHB and more, and it offers a 14-day free trial, then $119.99 a year.\n\nGoogle Search ads bring real visitors. About 40% of ad clicks go on to use one of our free retirement calculators. Almost none of those people then start a trial. I need someone who can look at both the ads and the website and tell me what to fix first.\n\nThe first project is a fixed-price audit and 30-day plan:\n\n\t•\tReview the Google Ads account: campaign setup, keywords, bidding, budget, and a correct conversion goal\n\t•\tReview the path from ad to calculator to free trial, and find where people drop off and why\n\t•\tRecommend 2–3 specific changes to test first\n\t•\tAdvise on whether other channels are worth trying\n\t•\tSuggest what should happen during the 14-day trial so more people subscribe\n\nIf it goes well, I'd like ongoing help managing Google Ads and improving the site.\n\nAbout me: I'm a solo founder and a lawyer by training, not a marketer. Please explain things in plain English. Ad spend is modest, about $15–25 a day. The attached brief has full background and numbers.\n\nYou'd be a good fit if you've grown a free-trial or subscription product and you run Google Search ads yourself. Experience with personal finance or with an older, careful audience is a plus.\n\nTo apply, please include:\n\n\t1.\tTwo or three trial or subscription products you've helped grow, what you changed, and the results\n\t2.\tYour fixed price and timeline for the audit\n\t3.\tBased on the description above, what you'd look at first", "letter": "𝗛𝗶 👋 𝘆𝗼𝘂𝗿 𝗽𝗿𝗼𝗽𝗼𝘀𝗮𝗹 𝗰𝗮𝘂𝗴𝗵𝘁 𝗺𝘆 𝗲𝘆𝗲. 𝗖𝗼𝘂𝗹𝗱 𝗺𝗮𝗸𝗲 𝘀𝗲𝗻𝘀𝗲 𝗳𝗼𝗿 𝘂𝘀 𝘁𝗼 𝗰𝗼𝗻𝗻𝗲𝗰𝘁.\n\nYour ads are doing their job: people click and use your calculators. They then get their answer and leave before they ever see a reason to start a trial.\n\nThe likely causes:\n\n1. Google is chasing the wrong goal\nIf the account counts a calculator use as a conversion, Google will keep finding people who want a free number, not people who want to subscribe.\n\n2. The keywords pull in researchers\nSearches like \"FERS pension calculator\" often come from people who only want one quick answer.\n\n3. No next step after the result\nIf the trial offer isn't tied to the number they just saw, such as \"see how this changes if you retire at 60,\" there's little reason to click further.\n\n4. The trial feels risky\nA careful audience may stop if they're asked for a card or a lot of personal details before they trust you.\n\nHere's what I'd look at first:\n- Which conversion goal Google is bidding toward\n- The search terms report, to see what people actually typed\n- The whole path on a phone, from ad to calculator result to trial signup, as one of your users would see it\n- What visitors do in the minute after they see their result\n\nOn other channels: at $15–25 a day, I'd fix this drop-off before spending anywhere new. More traffic into the same leak won't help. For the 14-day trial, I'd look at short emails tied to each person's own numbers. I work in Klaviyo and HubSpot, so those are easy to build.\n\nIt'd be great to go over the account together on a screen share. I'll walk you through what I find as we go, and we can talk through price, timeline and the past work that fits your situation.", "qa": [], "words": 310}, {"p": 41, "title": "Google Ads Specialist for B2B", "post": "We need a freelancer to create and manage Google Ads campaigns for a B2B company. The work includes setting up campaigns, optimizing targeting, and improving performance over time. You should be comfortable handling campaign structure, keyword research, and ongoing adjustments to increase lead generation and return on ad spend. We can provide copy. Experience supporting B2B marketing goals is important for this role.", "letter": "𝗛𝗶 👋 𝘆𝗼𝘂𝗿 𝗽𝗿𝗼𝗽𝗼𝘀𝗮𝗹 𝗰𝗮𝘂𝗴𝗵𝘁 𝗺𝘆 𝗲𝘆𝗲. 𝗖𝗼𝘂𝗹𝗱 𝗺𝗮𝗸𝗲 𝘀𝗲𝗻𝘀𝗲 𝗳𝗼𝗿 𝘂𝘀 𝘁𝗼 𝗰𝗼𝗻𝗻𝗲𝗰𝘁.\n\nI'd build your search campaigns around buyer phrases and block the job seekers before the first dollar goes out. Words like \"proposal writing\" and \"RFP\" pull in a lot of people looking for jobs, contract listings or templates, and none of them will hire you.\n\nI'd use tight phrase and exact match keywords that a company with a deadline would type, such as \"RFP response consultant\" or \"proposal writing services.\" From day one I'd add a negative keyword list for jobs, salary, templates and bid listings. Then I'd read the search terms report every week to keep it clean.\n\nTracking comes next. Your form fills and bookings should count as conversions in Google Ads. The leads your team marks as qualified in the CRM should go back to Google too, so it learns to find more of those and fewer tire kickers.\n\nHappy to go over your setup together on a screen share and show you how I'd lay out the first campaigns. Would a short call this week work?", "qa": [["What experience do you have generating qualified leads for consulting services, such as proposal support?", "I run Google Ads for service businesses, with campaigns built around return on investment and tracking that shows which leads turn into real business. I'd be glad to walk you through on a call how I'd apply that to proposal support."], ["How would you structure our first 90 days of advertising?", "Month one: set up tracking and launch tight search campaigns with a strong negative list. Month two: cut wasted search terms and shift budget to the keywords that bring qualified leads. Month three: grow what works and test new ads and keywords."], ["How would you target companies seeking our services while excluding people looking for government jobs, contract listings, or general information", "I'd use phrase and exact match on buyer terms like \"proposal writing services\" and \"RFP response consultant.\" I'd add negatives such as jobs, careers, hiring, salary, remote, template, example, free, how to and contract listing sites, then review the search terms every week."], ["How would you use our GA4, Google Tag Manager, Zoho Forms, Bookings, and CRM setup to measure results?", "I'd use Tag Manager to fire conversions on Zoho Forms submits and Bookings confirmations, sending them to GA4 and Google Ads. I'd capture the click ID with each lead, so the leads your CRM marks as qualified or won can go back into Google Ads as offline conversions and the bidding learns from real pipeline."], ["Who would manage the account, what would you do each week, and what would we receive in reporting?", "I'd manage the account myself. Each week I'd review search terms, add negatives, adjust bids and budget, and test ads. You'd get a weekly summary of spend, leads, qualified leads, cost per qualified lead, what I changed and what's next."]], "words": 184}, {"p": 40, "title": "Google & Meta Ads Expert for Growing CPG Brand (DTC / Shopify)", "post": "We're a CPG brand selling direct-to-consumer on Shopify, and we're looking for a sharp, experienced paid media buyer to manage and scale our Google and Meta ad accounts on an ongoing basis.\n\nMonthly Ad Spend: Mid 5 figures\n\nWhat You'll Own:\n- Full-funnel campaign strategy and execution across Google Ads (Search, Shopping, PMax) and Meta Ads (prospecting, retargeting, catalog)\n- Creative strategy and ad iteration recommendations (we handle production, you guide direction)\n- Audience testing, scaling winners, and killing underperformers quickly\n- Weekly reporting on KPIs with clear action items, not just data dumps\n- Ongoing collaboration with our team on landing pages, offers, and seasonal pushes\n\nWhat We're Looking For:\n- 3+ years managing paid media for DTC / ecommerce brands, specifically on Shopify\n- Proven track record hitting 4x+ ROAS at scale (not just on small budgets)\n- Deep understanding of the CPG customer journey and how paid fits into the broader funnel\n- Comfortable managing mid 5-figure monthly budgets without hand-holding\n- Strong creative eye and ability to brief winning ad concepts\n- Responsive communicator who flags issues early, not after the budget is spent\n\nBonus Points:\n- Experience with Shopify analytics, GA4, and Triple Whale or Northbeam\n- Familiarity with post-iOS14 attribution and how to make decisions despite data gaps\n- Track record scaling CPG brands from mid 5 to 6-figure monthly spend\n\nThis is an ongoing retainer, not a one-off project. We want someone who treats this like their own brand. If you're just looking to collect another client and run the same playbook you run for everyone, this isn't the right fit.\n\nTo Apply:\nShare 2-3 specific examples of DTC/CPG accounts you've managed, including spend levels and ROAS achieved. Generic proposals will be skipped.", "letter": "𝗛𝗶 👋 𝘆𝗼𝘂𝗿 𝗽𝗿𝗼𝗽𝗼𝘀𝗮𝗹 𝗰𝗮𝘂𝗴𝗵𝘁 𝗺𝘆 𝗲𝘆𝗲. 𝗖𝗼𝘂𝗹𝗱 𝗺𝗮𝗸𝗲 𝘀𝗲𝗻𝘀𝗲 𝗳𝗼𝗿 𝘂𝘀 𝘁𝗼 𝗰𝗼𝗻𝗻𝗲𝗰𝘁.\n\nAt mid five figures a month, I'd start by making sure Google and Meta aren't both claiming the same sale. On many Shopify brands, branded search, PMax and Meta retargeting all take credit for customers who were already going to buy. The account looks like it's hitting 4x, but blended returns are lower. Before scaling anything, I'd compare what each platform reports against Shopify and Triple Whale. Then I'd set targets on blended return and new-customer revenue.\n\nFrom there, the order would be:\n\n1. Clean up tracking and Merchant Center\nPMax and Shopping are only as good as the feed and the conversion data feeding them.\n\n2. Split brand from prospecting on Google\nBranded search gets its own campaign, and brand terms are excluded from PMax so it has to find new buyers.\n\n3. Keep Meta retargeting and catalog small\nMost of the budget and creative testing goes to prospecting, where new customers come from.\n\nWeekly reports would lead with what changed, why, and what we're doing next.\n\nYou asked for specific accounts with spend and ROAS. I'd rather go through past work live than put client numbers in a proposal. Could we do a short call where we go over your accounts together on a screen share? I'll show you where I think the overlap and the room to scale are.", "qa": [["Walk me through a CPG account you scaled from mid 5 figures to 6 figures monthly. What was your approach to testing and scaling, and what ROAS did you maintain through that growth?", "I'd rather go through past accounts and their numbers with you on the call than write them up here. My approach is to scale on blended return and new-customer revenue, not platform ROAS. I raise budgets in steps on proven ad sets and campaigns and keep a steady share of spend on new tests."], ["What's your process for briefing creative? Show me an example of a creative brief or direction you gave that led to a winning ad.", "Each brief starts with one customer reason to buy and one angle, then spells out the hook for the first few seconds, the proof, and the offer. I test different angles first, then make variations of whichever one wins. I'm glad to walk through how I'd brief your next round on the call."], ["How do you structure a Google Ads account for a CPG Shopify brand? Specifically, how do you balance PMax, branded search, and Shopping, and how do you prevent them from cannibalizing each other?", "Branded search runs on its own with tight budgets, and PMax runs with brand exclusions so it has to chase new customers. Standard Shopping covers hero products or margin tiers where I want control over bids and search terms. I check search term and placement data regularly to catch overlap, and I judge the whole account against blended Shopify revenue, not each campaign's reported ROAS."]], "words": 236}, {"p": 36, "title": "Performance-Based Google Ads Expert – B2B Lead Gen for High-Ticket Wellness Equipment", "post": "We're a Southern California company selling commercial wellness equipment to gyms, clinics, med spas, recovery studios and franchises: red light therapy beds, hyperbaric oxygen chambers, and electric cryotherapy chambers. Deal sizes are high-ticket, and every sale starts with a lead form.\n\nWe're looking for a Google Ads expert who wants to be paid for results, not just hours.\n\nCOMPENSATION\n- $1,500/month retainer (monthly fixed-price milestone)\n- + $50 bonus for every qualified B2B lead, paid monthly through Upwork bonuses\n- A qualified lead is a real business inquiry (gym, clinic, spa, studio, franchise, wellness center, etc.) submitted through our red light bed, hyperbaric or cryotherapy lead forms. Spam, duplicates, job seekers, and consumers looking for home devices don't count.\n- Ad spend is paid by us directly to Google and is separate from your fee.\n\nTHE SITUATION\n- US-targeted Search campaigns are live for red light beds, HBOT, cryo, and competitor terms.\n- We recently cleaned up the account: a lot of past spend went to consumer-level searches, and conversion tracking was counting the wrong things. We now have primary lead-form conversions per product page, and a HubSpot CRM.\n- We have strong historical data from a period when the account produced good leads, and we want to rebuild on what worked.\n\nWHAT YOU'LL DO\n- Audit the current account in your first 2 weeks and give us a written plan\n- Own keyword strategy, match types, and negative keywords to keep spend on commercial/B2B buyers, not home users\n- Write and test responsive search ads; recommend landing page improvements\n- Make sure conversion tracking is accurate (Google tag/GTM + HubSpot forms) and fix the HubSpot offline conversion import so closed deals flow back to Google\n- Manage bidding strategy, moving to conversion-based bidding once there's enough lead data\n- Expand thoughtfully: competitor campaigns, brand campaign, new product lines when they're ready\n- Send a short weekly update and a monthly report\n\nDEFINITION OF DONE / HOW WE MEASURE SUCCESS\n1. Week 2: written audit + 90-day plan delivered\n2. Week 3: conversion tracking verified. Every product lead form fires once per real submission, the footer/contact form is excluded, and HubSpot offline conversions import without errors\n3. Ongoing: weekly update (spend, leads, cost per lead, search-term cleanup done, next steps)\n4. Monthly: report by campaign. Spend, qualified leads, cost per qualified lead, and changes made + results\n5. Months 2–3: cost per qualified lead trending down month over month, with no more than ~10% of spend going to irrelevant/consumer search terms\n6. All work done inside our Google Ads account. We keep full ownership of the account, data and assets.\n\nWHO WE'RE LOOKING FOR\n- 3+ years managing Google Ads Search for B2B or high-ticket products ($10k+ price points)\n- Proven lead-gen results you can show us (screenshots or case studies with CPL and lead volume)\n- Comfortable with GTM, GA4, and CRM offline conversion imports (HubSpot is a plus)\n- Strong written English and responsive during US Pacific business hours\n- Bonus: experience in fitness, medical/aesthetic, or wellness equipment\n\nPlease answer the screening questions. Generic proposals will be skipped.", "letter": "𝗛𝗶 👋 𝘆𝗼𝘂𝗿 𝗽𝗿𝗼𝗽𝗼𝘀𝗮𝗹 𝗰𝗮𝘂𝗴𝗵𝘁 𝗺𝘆 𝗲𝘆𝗲. 𝗖𝗼𝘂𝗹𝗱 𝗺𝗮𝗸𝗲 𝘀𝗲𝗻𝘀𝗲 𝗳𝗼𝗿 𝘂𝘀 𝘁𝗼 𝗰𝗼𝗻𝗻𝗲𝗰𝘁.\n\nPast spend went to consumer searches and your tracking counted the wrong conversions, so the data from that period can still steer bidding toward home buyers.\n\nHere's what usually causes that:\n\n1. Broad product terms\n\"Red light therapy bed\" on broad or phrase match also shows your ads for searches like \"red light bed for home.\"\n\n2. All form fills counted the same\nIf a home buyer's form and a clinic's form both count as one conversion, conversion-based bidding will bid for both.\n\n3. Ads that don't name the buyer\nIf the ads don't say the equipment is for gyms, clinics and med spas, home shoppers click and you pay for those clicks.\n\n4. Short negative list and extra networks\nSearch partners, auto-applied recommendations and a short negative list put your ads in front of more consumer searches.\n\nTo find out which one it is, I'd compare the search terms from your good historical period with the last 60 days. I'd check which conversion actions are set as primary, and look at lead quality by campaign in HubSpot. Then I'd measure what share of spend goes to consumer terms today against your 10% target.\n\nWant to go over the account together on a screen share? I can show you what I'd change first.", "qa": [["Describe a B2B or high-ticket lead-gen account you managed: monthly spend, cost per lead before vs. after, and what you changed.", "I don't have a written case study for high-ticket B2B equipment, so I won't put numbers here that I can't back up. On the call, I'm happy to walk you through how I run Google Ads lead gen for service businesses and what I'd change in your account."], ["Our biggest past problem was spend leaking to consumers searching for cheap home red light devices. How would you keep spend on commercial buyers?", "I'd run exact and phrase match on commercial terms like \"commercial red light therapy bed\" and \"hyperbaric chamber for clinic,\" with a shared negative list (home, at home, personal, cheap, Amazon, panel, mask, portable) that I add to every week from the search terms. I'd also make the ads name the buyer (gyms, clinics, med spas) and send HubSpot lead quality back to Google, so bidding favors business leads."], ["How do you set up and verify conversion tracking when lead forms are embedded HubSpot forms (iframes)? Have you set up HubSpot offline conversion imports?", "Google Tag Manager can't see inside the iframe, so I'd trigger on HubSpot's form-submitted message filtered by form ID, which also leaves out the footer and contact form. Then I'd verify it with Tag Assistant and with test submissions matched against HubSpot records. I work in HubSpot, and I'd like to look at what's erroring in your offline import together on the call."], ["Are you comfortable with a $1,500/month retainer + $50 per qualified lead? If you'd structure it differently, tell us how.", "I'd like to talk the structure through with you on the call, including how we agree on what counts as a qualified lead each month."], ["What would you do in your first 14 days in our account?", "Week 1: check that every product form fires once per real submission, review search terms and negatives, and compare the current setup to your good historical period. Week 2: look at the HubSpot import, the ads and the landing pages, then deliver the written audit and a 90-day plan."]], "words": 227}, {"p": 43, "title": "Google Ads Expert Needed- Healthcare/HIPPA Compliance Experience REQUIERED", "post": "About the Opportunity\n\nWe are an established IV therapy and wellness clinic seeking an experienced Google Ads specialist to manage, optimize, and scale our paid advertising.\n\nWe need a proactive partner who takes ownership of results, improves qualified patient acquisition, and develops new strategies when performance plateaus. This role goes beyond campaign setup, budget adjustments, and monthly reports.\n\nDirect, hands-on experience advertising for HIPAA-regulated healthcare providers is mandatory. Applicants without this experience will not be considered.\n\nRequired Experience\n\n- Multiple years of success managing Google Ads and Meta Ads, including Google Search, Performance Max, and relevant Meta strategies.\n\n- Proven results generating qualified local leads for service-based businesses, preferably medical practices.\n\n- Experience maximizing smaller budgets; our monthly ad spend is $1,500–$2,500.\n\n- Strong knowledge of campaign structure, keywords, negative keywords, audience targeting, conversion tracking, and attribution.\n\n- Practical understanding of HIPAA requirements, patient privacy, sensitive health information, remarketing restrictions, and Google and Meta healthcare advertising policies.\n\n- Ability to identify and prevent protected health information (PHI) exposure through pixels, conversion APIs, analytics, lead forms, and third-party integrations.\n\n- Experience implementing HIPAA privacy-conscious measurement and staying current with platform, tracking, consent, and compliance changes.\n\nWe will verify healthcare and HIPAA experience through detailed questions and practical scenarios.\n\nKey Responsibilities\n\n- Audit existing accounts and develop a strategy aligned with our goals and budget.\n\n- Manage and optimize Google Ads to improve lead quality and reduce wasted spend.\n\n- Diagnose changes in cost per qualified lead, conversion rates, targeting, and campaign performance.\n\n- Run meaningful A/B tests and introduce new strategies before performance stagnates.\n\n- Review advertising data flows and maintain appropriate tracking and reporting practices to protect patient information.\n\n- Stay current with platform updates, healthcare advertising policies, and HIPAA-related developments.\n\n- Communicate regularly with concise reports explaining results, tests, recommendations, and next steps.\n\nIdeal Candidate\n\nYou combine technical expertise, analytical thinking, and sound judgment. You understand the difference between generating leads and acquiring qualified patients, and you prioritize business results over vanity metrics.\n\nWe value transparency, accountability, initiative, and clear communication. We are seeking a long-term partner who consistently demonstrates value.\n\nIf this sounds like you, please be sure to apply and we will be in touch.", "letter": "𝗛𝗶 👋 𝘆𝗼𝘂𝗿 𝗽𝗿𝗼𝗽𝗼𝘀𝗮𝗹 𝗰𝗮𝘂𝗴𝗵𝘁 𝗺𝘆 𝗲𝘆𝗲. 𝗖𝗼𝘂𝗹𝗱 𝗺𝗮𝗸𝗲 𝘀𝗲𝗻𝘀𝗲 𝗳𝗼𝗿 𝘂𝘀 𝘁𝗼 𝗰𝗼𝗻𝗻𝗲𝗰𝘁.\n\nFirst I'd look at what your site sends to Google and Meta, before touching a single bid. In IV therapy, page URLs, form fields and booking events can carry treatment details. If any of that reaches a pixel, you have a privacy problem. And on $1,500–$2,500 a month, a messy signal also means Google learns from the wrong conversions.\n\nHere's how I'd start:\n\n1. Map the data flow.\nWalk every tag, pixel, form and booking tool, and note exactly what leaves the site.\n\n2. Clean up conversions.\nFire them on neutral events with no health details. Then send back only the leads your front desk marks as booked patients, so the account bids toward patients and not form fills.\n\n3. Tighten Search.\nUse in-clinic, high-intent keywords around your location, plus a strong negative list. Then read the search terms every week.\n\nOne thing up front: most of our work has been for ecommerce and service businesses. I'd rather you test me with your HIPAA scenarios than take my word for it. The rest is the daily work: conversion tracking across Google and Meta, Google Tag Manager, and Search and Performance Max. Our agency has served 230+ clients and holds a 5.0 rating from 218 reviews on Upwork.\n\nWant to go over your account together on a screen share? I'll show you what I'd change first.", "qa": [["Describe a medical practice whose Google Ads you personally managed. Include the specialty, monthly ad spend, your responsibilities, measurable results, and how you distinguished qualified leads from total leads.", "I'd like to walk you through our relevant work on the call and let you judge whether it fits. On qualified leads, I'd have your team mark each lead as booked or not in your CRM. Then I'd import only booked patients back to Google as the main conversion, so the account bids toward patients instead of form fills."], ["A healthcare website sends patient-identifiable data and appointment events to Google Ads. How would you investigate, contain, and fix the issue while maintaining HIPAA-conscious campaign measurement?", "I'd check every tag in GTM preview and Tag Assistant to find which ones carry identifiers or appointment details, often from URLs, form fields or enhanced conversions. Then I'd pause those tags and conversion actions right away. To fix it, I'd strip PHI at the source, move conversions to neutral events, and import only de-identified qualified-lead outcomes, so measurement keeps working without sending patient data."], ["With $1,500–$2,500/month, which Google Ads campaigns would you prioritize for in-clinic IV therapy, and why? How would you filter mobile/at-home searches without losing qualified traffic?", "I'd put most of the budget into a tight local Search campaign on high-intent in-clinic terms, plus a small brand campaign. At this spend, Search gives you control and clean intent. To filter out at-home searches, I'd add negatives like \"mobile,\" \"at home,\" \"concierge\" and \"comes to you,\" then check search terms every week so I don't block ambiguous queries that still convert in-clinic."], ["Cost per qualified lead rises 35% after three stable months. What would you investigate, in what order, before making changes? Include a similar issue you resolved and the outcome.", "Before changing anything, I'd check in this order: tracking and conversion definitions, then lead quality and intake follow-up, then search terms, CPCs and auction changes, then landing page and booking flow, then seasonality and local competition. A real 35% jump usually traces back to one of these, and fixing the wrong one wastes a month. I'd rather share relevant past examples on the call than summarize them here."]], "words": 239}, {"p": 37, "title": "GA4 + Google Ads + Search Console Setup & Conversion Tracking for Local Laundromat", "post": "Scope of work\n\nMilestone 1: Foundation & Google stack\n- Install Google Tag Manager on our Duda site and route GA4 through it. Remove any duplicate tags.\n- Configure GA4: 14-month data retention, Google signals, and an internal traffic filter.\n- Verify Search Console as a Domain property via DNS, submit the sitemap, and request indexing of key pages.\n- Link GA4 ↔ Google Ads ↔ Search Console. Enable auto-tagging and set up the Conversion Linker.\n- Link Google Business Profile to Google Ads as a location asset. Add UTMs to the GBP website and booking links.\n\nMilestone 2: Conversion tracking\n- Build GTM events for app download clicks (App Store and Google Play), P&D booking clicks, click-to-call, directions, locker drop-off clicks, Sneaker & Hat Spa inquiries, and Mailchimp embed-form signups (inline JSONP forms, which need a dataLayer push or element-visibility trigger).\n- Mark the key events in GA4 and import them into Google Ads with primary/secondary settings.\n- Turn on enhanced conversions and the Google-hosted call and directions conversions.\n- QA every event in GTM Preview and GA4 DebugView.\n\nMilestone 3: Channel tracking & reporting\n- Create a UTM naming convention and a Link & Code Log in Google Sheets that auto-builds UTM links.\n- Set up Mailchimp GA link tracking and a Bitly branded domain. Rebuild our QR codes on UTM links, one per placement.\n- Build a 4-page Looker Studio dashboard (Overview, Google Ads, SEO, Email/Social/QR) plus a weekly KPI sheet for POS exports from Cents, Laundroworks, and Stripe.\n\nMilestone 4 (optional, quote separately): Google Ads build\n- Restructure or build Search campaigns for P&D, local self-serve, brand, and lockers/specialty items, with negative keywords and assets.\n- Deliver a keyword research summary using Search Console and Keyword Planner.\n\nDeliverables\n- Everything above live and tested.\n- A short written summary of what was configured, including every GTM tag, trigger, and event name.\n- A 20–30 minute recorded walkthrough of the dashboard and how to add new UTM links.", "letter": "𝗛𝗶 👋 𝘆𝗼𝘂𝗿 𝗽𝗿𝗼𝗽𝗼𝘀𝗮𝗹 𝗰𝗮𝘂𝗴𝗵𝘁 𝗺𝘆 𝗲𝘆𝗲. 𝗖𝗼𝘂𝗹𝗱 𝗺𝗮𝗸𝗲 𝘀𝗲𝗻𝘀𝗲 𝗳𝗼𝗿 𝘂𝘀 𝘁𝗼 𝗰𝗼𝗻𝗻𝗲𝗰𝘁.\n\nBefore building anything, I'd open your Duda site in Tag Assistant and see exactly what fires today. Duda has its own built-in GA4 setting, and sites often have that switched on plus a hardcoded snippet or an old Ads tag. Getting to one clean GA4 config through GTM first saves you from chasing doubled numbers later.\n\nOne thing worth deciding early is which events go into Google Ads as primary. You've listed about eight conversions. If app clicks and directions count the same as a P&D booking or a call, Smart Bidding will chase the cheapest action. I'd set P&D bookings and calls as primary and keep the rest secondary until you have enough data to judge them.\n\nAlso, Google-hosted call conversions need call assets running on the campaigns. If Milestone 4 isn't happening right away, it's worth adding those to whatever is live now so call data starts building.\n\nI set up conversion tracking in GTM, GA4 and Google Ads, and Digital Will Ads has done 342 projects on Upwork with a 5.0 rating. Happy to hop on a short call and go over your site and accounts together on a screen share. Then I can give you a firm quote.", "qa": [["How would you track a conversion on an inline Mailchimp embed form that doesn’t redirect to a thank-you page?", "The classic Mailchimp embed shows its success message in the #mce-success-response div without leaving the page. I'd fire an element-visibility trigger on that div with DOM change observation on, or use a small listener that pushes a dataLayer event on success. I'd fire it once per page so a re-submit doesn't double count."], ["How would you avoid double-counting if GA4 is already installed directly in the site builder?", "I'd turn off Duda's built-in GA4 integration, remove any hardcoded gtag snippet, and send GA4 only through GTM. Then I'd confirm in Tag Assistant and DebugView that each page load sends one page_view to one measurement ID."], ["Share one Looker Studio dashboard or conversion tracking setup you’ve built.", "I'd rather walk you through how I'd structure your setup and dashboard live on our call than paste a link here."], ["Your estimated hours and price for Milestones 1–3, and separately for Milestone 4.", "I'd like to see your Duda site, current tags and Ads account before putting numbers on it. I can give you hours and price for Milestones 1–3, and separately for Milestone 4, on the call."]], "words": 216}, {"p": 33, "title": "Facebook Ads Manager", "post": "We are seeking a skilled Facebook Ads Manager to optimize and manage our ad campaigns on Facebook and Instagram. The ideal candidate will have experience in creating and executing successful ad strategies, analyzing performance metrics, and making data-driven decisions to improve ad efficiency. You will be responsible for managing budgets, targeting audiences, and ensuring ad campaigns align with our brand goals.", "letter": "𝗛𝗶 👋 𝘆𝗼𝘂𝗿 𝗽𝗿𝗼𝗽𝗼𝘀𝗮𝗹 𝗰𝗮𝘂𝗴𝗵𝘁 𝗺𝘆 𝗲𝘆𝗲. 𝗖𝗼𝘂𝗹𝗱 𝗺𝗮𝗸𝗲 𝘀𝗲𝗻𝘀𝗲 𝗳𝗼𝗿 𝘂𝘀 𝘁𝗼 𝗰𝗼𝗻𝗻𝗲𝗰𝘁.\n\nBefore touching budgets or audiences, I'd check your tracking. Meta decides who sees your ads based on the purchases or leads your pixel reports back. If the pixel and Conversions API aren't sending those cleanly, every optimization after that is built on bad data.\n\nOnce I trust the numbers, I'd look at which ads and audiences actually bring in buyers, not just clicks, and move budget away from the ones that don't. Then I'd set up a steady rhythm of new creative tests. On Facebook and Instagram right now, the creative does most of the targeting work, so that's usually where the biggest gains come from.\n\nI run Meta ads at Digital Will Ads, and I'm Meta and Google certified. Our team has done 342 projects on Upwork, with a 5.0 rating from 218 reviews.\n\nWould you be up for a short call where we go through your Ads Manager together on a screen share? I'd also like to know what matters most to you right now: sales, leads, or getting your cost per result down.", "qa": [["Describe your recent experience with similar projects", "I run Meta, TikTok and Pinterest ads, and manage Google Ads for ecommerce and service businesses. Our agency has completed 342 projects on Upwork with a 5.0 rating from 218 reviews. I'm happy to walk you through relevant work on our call."], ["Please list any certifications related to this project", "I'm Meta certified and Google certified."], ["How do you decide what tone of voice to write in?", "I match your brand's voice first. I look at your site, your best-performing ads and the words your customers use in reviews. Then I test variations to see which tone your audience actually responds to."], ["How do you use metrics to inform your strategy?", "I start by making sure tracking is accurate. Then I judge campaigns on cost per purchase or lead and return on ad spend, and use click-through and video hold rates to tell whether a weak ad has a creative problem or an audience problem."], ["How do you approach difficult conversations with customers?", "I raise problems early and tell the truth, even when it isn't what the client wants to hear. I bring the numbers and a clear plan for what we'll do next."]], "words": 190}, {"p": 22, "title": "Google Ads Specialist for Hearing Aids", "post": "We need an expert to improve Google Ads performance for one hearing aid model on Shopify. The goal is to increase branded traffic ROAS to 4 and non-branded traffic ROAS to 2. Medical advertising has some restrictions, so experience navigating those is important. Our current expert is only adjusting keywords without seeing meaningful improvements, so we need someone who can identify new opportunities, optimize campaigns, and improve overall performance. Please share relevant experience with medical or healthcare-related ads and results you have achieved.", "letter": "𝗛𝗶 👋 𝘆𝗼𝘂𝗿 𝗽𝗿𝗼𝗽𝗼𝘀𝗮𝗹 𝗰𝗮𝘂𝗴𝗵𝘁 𝗺𝘆 𝗲𝘆𝗲. 𝗖𝗼𝘂𝗹𝗱 𝗺𝗮𝗸𝗲 𝘀𝗲𝗻𝘀𝗲 𝗳𝗼𝗿 𝘂𝘀 𝘁𝗼 𝗰𝗼𝗻𝗻𝗲𝗰𝘁.\n\nKeywords alone rarely move ROAS when you're selling one product. The bigger levers usually sit around the keywords, not in them.\n\nFor one hearing aid model on Shopify, these are the likely causes:\n\n1. Tracking that misreads sales\nIf Shopify purchases and their values aren't reaching Google Ads cleanly, you could be optimizing toward a ROAS number that isn't real.\n\n2. Branded and non-branded mixed together\nPerformance Max and broad match often soak up branded searches. That blurs both targets and hides what non-branded traffic is really doing.\n\n3. Shopping held back by health policies\nHealth products often get limited or disapproved in Merchant Center. That quietly cuts off your best non-branded traffic.\n\n4. The page, not the click\nNon-branded searchers are comparing options. If the product page doesn't answer their questions, more keyword work won't fix the conversion rate.\n\nTo find out which it is, I'd check your conversion tracking against Shopify orders. Then I'd split performance by branded and non-branded search terms and look through Merchant Center and policy diagnostics for limited or disapproved items. Within an hour or so, that usually shows where the money is leaking.\n\nWant to go over your account together on a screen share? I can show you what I find as we go.\n\nWill", "qa": [["Describe your recent experience with similar projects", "I manage Google Ads for ecommerce stores, including Shopify, with a focus on return on ad spend. Much of that work is Shopping and Performance Max campaigns, fixing Merchant Center accounts and setting up accurate conversion tracking. I'd be glad to walk you through specific accounts on a call."]], "words": 226}, {"p": 39, "title": "Senior Google Ads & Paid Acquisition Specialist | Lead Generation, Tracking & Growth", "post": "We're an established U.S.-based online education company offering premium, private 1-on-1 Spanish lessons for adults.\n\nWe've been operating for over 10 years and have an established customer base, a dedicated admissions team, and a structured consultation-to-enrollment process.\n\nHistorically, most of our growth has come through organic channels and content marketing. We're now looking to build a scalable, profitable paid customer acquisition channel.\n\nWe're willing to invest significantly in advertising if the economics support it. Our priority is to find a repeatable system that consistently acquires paying customers at a sustainable cost.\n\nWho we're looking for\n\nWe're looking for an experienced, hands-on performance marketing specialist who can help us develop, launch, measure, and optimize our paid acquisition efforts.\n\nWe don't need a general digital marketing agency or someone who simply knows how to configure Google Ads.\n\nWe want someone who understands customer acquisition economics, has experience generating qualified leads for service-based businesses, and can connect advertising performance to actual paying customers.\n\nExperience with online education, tutoring, coaching, subscription services, or other consultation-driven businesses is especially relevant.\n\nScope of work\n\nPhase 1: Strategy and audit\n\nReview our existing website, lead generation process, advertising history, and analytics setup.\n\nEvaluate whether Google Search, Meta, or another channel presents the strongest initial opportunity.\n\nRecommend a focused acquisition strategy based on customer intent, competition, realistic acquisition costs, and conversion potential.\n\nHelp establish appropriate performance targets and a testing budget.\n\nPhase 2: Technical setup and campaign launch\n\nBuild and configure the initial advertising campaign.\n\nResearch keywords, audiences, competitors, and relevant messaging.\n\nRecommend landing page improvements or a dedicated campaign landing page.\n\nConfigure and validate conversion tracking.\n\nEstablish attribution between advertising, consultation bookings, and actual customer enrollments where technically feasible.\n\nDocument any tracking limitations and coordinate additional technical implementation if necessary.\n\nOur current systems include Zoho CRM and AppToto for consultation scheduling.\n\nPhase 3: Optimization and growth\n\nMonitor campaign performance and lead quality.\n\nOptimize targeting, bidding, ad messaging, and budget allocation.\n\nEvaluate the entire customer acquisition funnel, not just cost per lead.\n\nProvide actionable weekly performance reporting.\n\nRecommend when to increase spending, change strategy, or pause an underperforming campaign.\n\nWhat success looks like\n\nThe objective is to establish a measurable, repeatable paid acquisition process.\n\nWe understand that paid advertising involves experimentation and that profitability cannot be guaranteed.\n\nWe're looking for someone who approaches campaigns analytically, manages budgets responsibly, and can explain what the results mean for the business.\n\nOur primary metric is the cost of acquiring a paying customer, not simply generating website traffic or consultation bookings.\n\nRequirements\n\nProven experience managing Google Search campaigns for lead-generation businesses.\n\nStrong understanding of customer acquisition cost, conversion rates, and campaign profitability.\n\nExperience with Google Analytics 4, Google Tag Manager, and conversion tracking.\n\nAbility to measure outcomes beyond initial lead submissions.\n\nStrong analytical and communication skills.\n\nExperience running campaigns targeting U.S. customers.\n\nWillingness to work directly with our founders and admissions team.\n\nExperience with Meta Ads, Zoho CRM, offline conversion tracking, and subscription-based businesses is a plus.\n\nEngagement\n\nWe're proposing an initial fixed-price engagement covering strategy, technical setup, campaign launch, and approximately 30 days of post-launch optimization.\n\nWe are open to an ongoing relationship if the collaboration and results justify it.\n\nAdvertising spend will be managed separately from your professional fees.\n\nPlease include a proposed scope, timeline, and pricing breakdown in your application.\n\nWhen applying, please share\n\nTwo relevant examples of lead-generation campaigns you've managed, including advertising spend, cost per qualified lead, and cost per acquired customer when available.\n\nYour experience connecting advertising platforms to a CRM and tracking actual sales or enrollments.\n\nHow you would approach selecting the first advertising channel for a business like ours.\n\nYour proposed process for the first 30 to 60 days.\n\nWhether you personally perform campaign setup and optimization or delegate parts of the work.\n\nWe're looking for a long-term growth partner, beginning with a focused and measurable initial project.", "letter": "𝗛𝗶 👋 𝘆𝗼𝘂𝗿 𝗽𝗿𝗼𝗽𝗼𝘀𝗮𝗹 𝗰𝗮𝘂𝗴𝗵𝘁 𝗺𝘆 𝗲𝘆𝗲. 𝗖𝗼𝘂𝗹𝗱 𝗺𝗮𝗸𝗲 𝘀𝗲𝗻𝘀𝗲 𝗳𝗼𝗿 𝘂𝘀 𝘁𝗼 𝗰𝗼𝗻𝗻𝗲𝗰𝘁.\n\nBefore any money goes into ads, I'd build the link between the ad click and the enrollment. Your target is cost per paying customer, so Google needs to know who enrolled, not just who booked a consultation.\n\nIn practice, that means capturing the Google click ID when someone books in AppToto, carrying it into the Zoho record, and sending enrollments back to Google Ads as offline conversions. With that in place, you can see your real cost per customer by campaign and keyword. In time, Google can also bid toward people who enroll rather than people who just fill out a form. Without it, you'd be judging the channel on bookings, and for a premium 1-on-1 offer, that can point you in the wrong direction.\n\nOn channel, I'd expect Google Search to be the stronger place to start. People already searching for private online Spanish lessons are closer to buying. Meta can come later to create demand once we know what an enrolled customer is worth and what we can afford to pay for one. I'd confirm that with keyword volume and competitor checks before committing your budget.\n\nYou asked for a scope, timeline and pricing breakdown, plus two past campaign examples with numbers. I'd rather walk you through those properly than squeeze them in here. Could we do a short call where we go over your site, your Zoho setup and how a consultation turns into an enrollment on a screen share? I'll bring the plan for the first 30 to 60 days.\n\nWill Arnett\nFounder, Digital Will Ads", "qa": [["Describe a recent campaign where you acquired paying customers for a lead-generation business. Include approximate monthly spend, cost per qualified lead, and customer acquisition cost. What did you personally manage?", "I manage Google Ads for service and ecommerce businesses with campaigns built around return on investment, and I run the accounts myself. I'd like to walk you through specific campaigns with spend, cost per lead and acquisition cost on the call, so you can see the numbers in context."], ["Have you implemented conversion tracking connecting Google Ads to a CRM and actual closed sales? Describe the tools and how you validated attribution.", "I set up conversion tracking across Google and Meta, and I work with CRMs like HubSpot and Go High Level. For you, I'd capture the click ID at AppToto booking, store it in Zoho, and import enrollments to Google Ads as offline conversions. I'd validate it with end-to-end test bookings, then match Zoho enrollments against what Google reports."], ["If you were evaluating an established online tutoring company with little paid advertising history, how would you decide between Google Search and Meta Ads?", "I'd start by looking at search volume and competitor costs for terms like private online Spanish lessons. That tells me whether people are already looking and what a click costs against what a customer is worth to you. Search usually wins first for a high-ticket, consultation-led offer because the intent is already there, and Meta follows once we know our numbers."], ["What would your first 30 days look like, and what specifically would you deliver before the first dollar of advertising spend?", "Week one is an audit of your site, booking flow, Zoho and analytics, plus the keyword and competitor research. Before any spend, you'd get the channel recommendation, a target cost per customer, a testing budget, landing page changes, and tested tracking from click to booking to enrollment. Launch comes after that, followed by weekly reports that show cost per enrolled customer, not just leads."], ["What results or warning signs would lead you to pause a campaign rather than continue spending money?", "I'd pause if tracking breaks or can't be trusted, because then we're spending blind. I'd also pause if spend passes an agreed multiple of your target cost per customer with no enrollments, or if your admissions team tells us the consultations aren't the right people. Search terms full of free or cheap lesson queries that I can't filter out would be another reason to stop and rethink."]], "words": 274}, {"p": 10, "title": "Meta Ads Media Buyer for Window Replacement Lead Generation", "post": "Looking for an experienced Meta Ads media buyer to audit, optimize, and manage existing/future lead generation campaigns. You should have proven results generating qualified leads and booked estimates for home service businesses, with strong skills in creative testing, conversion tracking, and improving cost per qualified appointment.", "letter": "𝗛𝗶 👋 𝘆𝗼𝘂𝗿 𝗽𝗿𝗼𝗽𝗼𝘀𝗮𝗹 𝗰𝗮𝘂𝗴𝗵𝘁 𝗺𝘆 𝗲𝘆𝗲. 𝗖𝗼𝘂𝗹𝗱 𝗺𝗮𝗸𝗲 𝘀𝗲𝗻𝘀𝗲 𝗳𝗼𝗿 𝘂𝘀 𝘁𝗼 𝗰𝗼𝗻𝗻𝗲𝗰𝘁.\n\nI'd start by checking what Meta is optimizing for. Many lead gen accounts optimize for form fills, and Meta gets very good at finding people who fill out forms but never book an estimate. If your goal is cost per qualified appointment, Meta needs to see the appointments.\n\nHere's what I'd do first:\n\n1. Send booked estimates back to Meta\nConnect your CRM (I work with Go High Level and HubSpot) so qualified leads and booked appointments flow back as conversion events. Then the campaigns can optimize toward those instead of raw leads.\n\n2. Add friction to the form on purpose\nAsk whether they own the home, roughly how many windows, and their timeline. You'll get fewer leads, but more of them will be the ones your sales team wants.\n\n3. Test creative by angle, not by tweak\nFor windows, I'd test angles like drafty rooms and energy bills against curb appeal and before/after. Then I'd judge each one by booked estimates, not cost per lead.\n\nIf you're open to it, let's get on a short call and go through your Ads Manager and CRM together on a screen share. That will show us where the unqualified leads are coming from and what to fix first.\n\nWill", "qa": [], "words": 221}]</script>
<script>
const L = JSON.parse(document.getElementById("data").textContent);
const CHOICES = [["send", "Send it as is"], ["edit", "Send it with changes"], ["no", "Do not send it"]];
const LABEL = Object.fromEntries(CHOICES);
const KEY = "proposal-drafts-2026-11-04";
const LAST = L.length + 1;   // slide 0: the start; 1 to L.length: the letters; LAST: send the feedback
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// A reader's marks, kept in their own browser (a convenience: the page works without it).
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { console.warn("[drafts] storage not readable", e); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { console.warn("[drafts] storage not writable", e); } };
const marked = () => L.filter((_, i) => state[i]?.v).length;
let at = 0;

function startSlide() {
  return `<div class="kicker">Proposal drafts · Nov 4, 2026</div>
    <h1>10 proposals from our new writer</h1>
    <p class="lede">The brain's new writer wrote these 10 Upwork proposals for real job posts. We did not send them.</p>
    <ol class="steps">
      <li>Read each letter as if you were the client who posted the job.</li>
      <li>Choose one answer under it, and add a note if you want.</li>
      <li>On the last slide, type your name and click <b>Copy my feedback</b>.</li>
      <li>Paste it to Will in Slack.</li>
    </ol>
    <p class="small">The bold first line is Lancer's opener: the brain puts it on top of every letter. Your marks stay in your own browser until you copy them.</p>
    <p style="margin-top:22px"><button class="big" type="button" data-go="1">Start with letter 1 ›</button></p>`;
}
function letterSlide(i) {
  const x = L[i], s = state[i] || {};
  const first = x.post.split("\n").find(l => l.trim()) || "";
  return `<div class="kicker">Letter ${i + 1} of ${L.length}</div>
    <h2>${esc(x.title)}</h2>
    <details class="post"><summary>Read the job post</summary><div class="text">${esc(x.post)}</div></details>
    <p class="excerpt">${esc(first.length > 220 ? first.slice(0, 220).trim() + "…" : first)}</p>
    <div class="letter">${esc(x.letter)}</div>
    ${x.qa.length ? `<h3>The answers to the ${x.qa.length} screening question${x.qa.length > 1 ? "s" : ""}</h3>` + x.qa.map(([q, a]) => `<div class="qa"><p class="q">${esc(q)}</p><p class="a">${esc(a)}</p></div>`).join("") : ""}
    <div class="fb">
      <label id="c${i}">Would you send this letter?</label>
      <div class="choices" role="group" aria-labelledby="c${i}">${CHOICES.map(([v, t]) => `<button type="button" data-i="${i}" data-v="${v}" aria-pressed="${s.v === v}">${t}</button>`).join("")}</div>
      <label for="n${i}">What would you change? (optional)</label>
      <textarea id="n${i}" data-i="${i}" placeholder="A line you would cut, a fact that is wrong, how a client would read it...">${esc(s.note || "")}</textarea>
    </div>`;
}
function lastSlide() {
  return `<div class="kicker">Send your feedback</div>
    <h2>You marked ${marked()} of ${L.length} letters</h2>
    <ul class="marks">${L.map((x, i) => {
      const v = state[i]?.v;
      return `<li><a href="#${i + 1}">${i + 1}. ${esc(x.title)}</a><span class="tag ${v || "none"}">${v ? LABEL[v] : "Not marked"}</span></li>`;
    }).join("")}</ul>
    <label for="name">Your name</label>
    <input type="text" id="name" placeholder="Your name" autocomplete="name" value="${esc(state.name || "")}">
    <p style="margin-top:14px"><button class="big" id="copy" type="button">Copy my feedback</button><span class="done" id="done" role="status" aria-live="polite"></span></p>
    <p class="small">Then paste it to Will in Slack.</p>`;
}
function dots() {
  const d = [`<button type="button" data-go="0" aria-label="Start" ${at === 0 ? 'aria-current="true"' : ""}></button>`];
  L.forEach((_, i) => d.push(`<button type="button" data-go="${i + 1}" class="${state[i]?.v || ""}" aria-label="Letter ${i + 1}" ${at === i + 1 ? 'aria-current="true"' : ""}></button>`));
  d.push(`<button type="button" data-go="${LAST}" aria-label="Send your feedback" ${at === LAST ? 'aria-current="true"' : ""}></button>`);
  document.getElementById("dots").innerHTML = d.join("");
}
function show(n) {
  at = Math.max(0, Math.min(LAST, n));
  document.getElementById("slide").innerHTML = at === 0 ? startSlide() : at === LAST ? lastSlide() : letterSlide(at - 1);
  document.getElementById("where").textContent = at === 0 ? "Start" : at === LAST ? "Send your feedback" : `Letter ${at} of ${L.length} · ${marked()} marked`;
  document.getElementById("back").disabled = at === 0;
  const next = document.getElementById("next");
  next.disabled = at === LAST;
  next.textContent = at === L.length ? "Finish ›" : "Next ›";
  dots();
  scrollTo(0, 0);
  if (location.hash !== `#${at}`) history.replaceState(null, "", `#${at}`);
  console.log("[drafts] slide", { at, marked: marked() });
}
const go = n => show(n);
document.getElementById("back").addEventListener("click", () => go(at - 1));
document.getElementById("next").addEventListener("click", () => go(at + 1));
addEventListener("hashchange", () => { const n = parseInt(location.hash.slice(1), 10); if (!Number.isNaN(n) && n !== at) show(n); });
// The left and right arrows move the slides (decks get the arrow keys), but never while someone types.
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === "ArrowRight") { e.preventDefault(); go(at + 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); go(at - 1); }
});
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) { go(+g.dataset.go); return; }
  const b = e.target.closest(".choices button");
  if (b) {
    const i = +b.dataset.i;
    state[i] = { ...(state[i] || {}), v: b.dataset.v };
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    save(); dots();
    document.getElementById("where").textContent = `Letter ${at} of ${L.length} · ${marked()} marked`;
    console.log("[drafts] marked", { letter: i + 1, p: L[i].p, choice: b.dataset.v });
  }
  if (e.target.id === "copy") copy();
});
document.addEventListener("input", e => {
  if (e.target.matches("textarea[data-i]")) { const i = +e.target.dataset.i; state[i] = { ...(state[i] || {}), note: e.target.value }; save(); }
  if (e.target.id === "name") { state.name = e.target.value; save(); }
});
function text() {
  const who = (state.name || "").trim() || "(no name)";
  const lines = [`Proposal drafts: feedback from ${who}`];
  L.forEach((x, i) => {
    const s = state[i] || {};
    lines.push(`${i + 1}. ${x.title} (P-${x.p}): ${s.v ? LABEL[s.v] : "not marked"}`);
    if ((s.note || "").trim()) lines.push(`   ${s.note.trim().replace(/\n+/g, " / ")}`);
  });
  lines.push(`Marked ${marked()} of ${L.length}.`);
  return lines.join("\n");
}
async function copy() {
  const t = text(), done = document.getElementById("done");
  try {
    await navigator.clipboard.writeText(t);
  } catch (e) {
    // Older browsers: copy through a hidden text box.
    const ta = Object.assign(document.createElement("textarea"), { value: t });
    document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
    console.warn("[drafts] clipboard API failed; used the fallback", e);
  }
  done.textContent = "Copied. Paste it to Will.";
  console.log("[drafts] feedback copied", { chars: t.length, marked: marked() });
}
const start = parseInt(location.hash.slice(1), 10);
show(Number.isNaN(start) ? 0 : start);
console.log("[drafts] page ready", { letters: L.length });
</script>
</body>
</html>
