<script id="config" type="application/json">{"key": "bid-filter-2026-11-04", "noun": "Job", "nouns": "jobs", "tab": "post", "head": "Which jobs we bid on", "question": "Should we bid on this job?", "noteLabel": "Why? (optional)", "notePlaceholder": "What makes this job right or wrong for us...", "choices": [["bid", "Bid on it", "ok"], ["skip", "Skip it", "bad"], ["unsure", "Not sure", "mid"]], "start": "<div class=\"kicker\">Which jobs we bid on · Oct 22 to Nov 4<\/div>\n          <h1>Before: Lancer. Now: the brain.<\/h1>\n          <p class=\"lede\">From Oct 22 to Nov 4, Lancer sent the brain 312 Upwork jobs. Lancer bid or skipped as it always does. The brain decided too, but it sent nothing.<\/p>\n          <div class=\"stats\">\n            <div class=\"stat\"><b>123<\/b><span>both bid<\/span><\/div>\n            <div class=\"stat\"><b>47<\/b><span>both skipped<\/span><\/div>\n            <div class=\"stat\"><b>88<\/b><span>Lancer bid, the brain skips<\/span><\/div>\n            <div class=\"stat\"><b>31<\/b><span>the brain bids, Lancer skipped<\/span><\/div>\n          <\/div>\n          <p class=\"say\">They agree on 58.8% of the jobs. 23 jobs have no decision from the brain yet. <b>Lancer<\/b> decides with an AI rating of the post against Will's profile. <b>The brain<\/b> skips a job when one of its rules hits (the client, the work, account trouble, the deal, or a job not open to us). Then it bids only when the chance of a call is worth the cost of the bid.<\/p>\n          <h3>Why the brain skips the 88 jobs that Lancer bid on<\/h3>\n          <table class=\"reasons\"><tr><td>Client outside the US<\/td><td class=\"n\">56<\/td><\/tr><tr><td>Client refuses agencies<\/td><td class=\"n\">14<\/td><\/tr><tr><td>Client is an agency<\/td><td class=\"n\">7<\/td><\/tr><tr><td>Fixed price under $500<\/td><td class=\"n\">4<\/td><\/tr><tr><td>SEO with no paid ads<\/td><td class=\"n\">4<\/td><\/tr><tr><td>Written to one freelancer<\/td><td class=\"n\">2<\/td><\/tr><tr><td>Not paid online ads<\/td><td class=\"n\">1<\/td><\/tr><\/table>\n          <ol class=\"steps\">\n            <li>The next 10 slides show 10 of these disagreements: 5 where Lancer bid and the brain skips, then 5 where the brain bids and Lancer skipped.<\/li>\n            <li>Read the job post. Then see what Lancer did on <b>Lancer (before)<\/b> and what the brain does on <b>Now (the brain)<\/b>.<\/li>\n            <li>Choose one answer: should we bid on this job? Add a note if you want.<\/li>\n            <li>On the last slide, type your name and click <b>Copy my feedback<\/b>. Paste it to Will in Slack.<\/li>\n          <\/ol>\n          <p style=\"margin-top:22px\"><button class=\"big\" type=\"button\" data-go=\"1\">Start with job 1 ›<\/button><\/p>"}</script>
<script id="items" type="application/json">[{"ref": "2115381512384613981", "title": "Google Ads Audit: Why Did Our Cost Per Lead Jump After a Landing Page Change?", "kicker": "Lancer bid · the brain skips", "tabs": [["post", "The job post", "<div class=\"ptext\">We&#x27;re a large plumbing company in the US. We use Google Ads for lead generation and spend around $14,000 a month.\n\nOur cost per lead is too high. Performance was good until August. In August we changed our landing pages, and since then performance has dropped.\n\nI&#x27;m looking for an experienced Google Ads specialist to audit the account, find out why performance dropped, and tell us what to fix first. This is a one-off audit, not ongoing management.\n\nYou&#x27;ll get read-only access to our Google Ads account.\n\nWhat I need back:\n\n1. Whether the landing page change caused the drop, or whether something else changed at the same time\n2. Whether our conversion tracking still works properly on the new pages\n3. Where we&#x27;re wasting spend, with the numbers\n4. The first three changes you&#x27;d make, in order, and why\n\nThe job is done when I have a written report that covers all four points, with every finding backed by numbers from the account (dates, spend, leads, cost per lead) so I can check it myself.\n\nIn your proposal, tell me:\n\n- How you&#x27;d approach this audit\n- Roughly how long it takes you<\/div><p><a class=\"ext\" href=\"https://www.upwork.com/jobs/~022115381512384613981\" target=\"_blank\" rel=\"noopener\">Open the post on Upwork ›<\/a><\/p>"], ["lancer", "Lancer (before)", "<div class=\"verdict ok\">Lancer bid on this job<\/div><p class=\"say\">Lancer's AI rated the job <b>80 of 100<\/b> against Will's profile, and gave this reason:<\/p><blockquote>The job aligns perfectly with William&#x27;s expertise in Google Ads audits, conversion tracking, and the home services industry. It is a professional service request that falls within his core capabilities and does not violate any of his hard no-gos.<\/blockquote><p class=\"say\"><b>What happened:<\/b> Lancer's lead export has no result for this bid yet.<\/p>"], ["now", "Now (the brain)", "<div class=\"verdict bad\">The brain would skip this job<\/div><p class=\"say\">The rule that skips it:<\/p><ul class=\"why\"><li><b>Client outside the US.<\/b> The client's country on Upwork is United Kingdom.<\/li><\/ul>"]]}, {"ref": "2115801934686268561", "title": "Google Ads & Landing Page Specialist for Philadelphia Event Space", "kicker": "Lancer bid · the brain skips", "tabs": [["post", "The job post", "<div class=\"ptext\">I am looking for an experienced freelancer or small team to help generate quality leads for my event space in Philadelphia.\n\nI need someone who understands how to set up and manage Google Ads for local lead generation and either build or direct the creation of a high-converting landing page that turns clicks into real inquiries and bookings.\n\nThis project is about performance, not just design. I am looking for someone who understands how to connect search intent, ad messaging, landing page structure, and conversion strategy.\n\nScope of Work:\n•\tSet up and manage Google Ads campaigns for my event space\n•\tPerform keyword research focused on high-intent local searches\n•\tWrite or refine ad copy designed to attract qualified leads\n•\tBuild or help create a landing page focused on conversions\n•\tImprove call-to-action placement, messaging, and overall user flow\n•\tSet up conversion tracking for form submissions, calls, or inquiries\n•\tMonitor campaign performance and make recommendations for improvement\n•\tReview my current website and advise on what should be improved or separated into a true landing page\n\nIdeal Candidate:\n•\tHas experience with Google Ads for local businesses\n•\tHas managed Google Ads for U.S.-based local businesses\n•\tUnderstands landing page conversion and lead generation\n•\tKnows how to improve lead quality, not just traffic\n•\tCan think strategically about conversions and ad performance\n•\tHas experience with service-based businesses, venues, or local businesses\n•\tCan clearly explain recommendations and next steps\n\nProject Details:\n•\tLocation: West Philadelphia, PA (19104). The venue hosts funeral repasses, baby showers, birthday parties, prom send-offs, meetings, church and community events, and holiday parties.\n•\tStarting ad budget: $20–30 per day. My average booking is about $500.\n•\tAccount ownership: I will create and own the Google Ads account and add you as a user. Please do not create a new account for me or ask for my passwords.\n•\tBilling: Ad spend is billed directly to my card by Google. Your fee is paid separately through Upwork.\n•\tLanding page: Built in GoHighLevel, which I already use, on a subdomain of my website (for example, book.greeneventspace.com). My main website, greeneventspace.com, runs on WordPress and should not be changed.\n•\tTracking: Conversion tracking for calls and form submissions must be working before ads go live.\n•\tPayment structure: Fixed-price milestones: (1) account, campaign, and tracking setup; (2) landing page; (3) first 30 days of management. Ongoing monthly management after that if results are good.\n•\tTimeline: I would like to hire within the next 1–2 weeks and have ads live within 2–3 weeks of starting, so leads are coming in before the December holiday season.\n•\tReporting: A short weekly update with ad spend, number of leads, cost per lead, bookings, and search terms you blocked, plus a brief weekly or biweekly check-in call during U.S. Eastern business hours.\n•\tOwnership: All ads, keywords, landing pages, tracking, and reports stay with me if we stop working together.\n\nCommunication Requirements:\nClear communication is very important. You do not need to be a native English speaker, but you should be able to communicate clearly and professionally in English through Zoom, email, messaging, or project management tools.\n\nTo Apply:\nPlease send:\n•\tA short introduction\n•\tRelevant experience\n•\tExamples of similar work\n•\tWhether you handle both Google Ads and landing pages\n•\tYour general process for a project like this\n•\tYour proposed pricing and what it includes (for example, a setup fee and/or a monthly management fee, plus any minimum contract length)\n•\tAnswers to the questions below\n\nQuestions to Answer in Your Proposal:\n1.\tWhat campaign type, match types, and location settings would you use for a local event venue, and why?\n2.\tHow will you track calls, form submissions, and which leads actually book?\n3.\tWhat would you do in the first 30 days?\n4.\tShare the cost per lead you achieved for a local service business client, and what type of business it was.\n5.\tIf after two weeks we have clicks but no leads, what would you check first?\n6.\tWhat would you need from me to get started?\n\nImportant:\nI am looking for someone who understands how to turn clicks into real business opportunities. If your experience is only in design without Google Ads, or only in Google Ads without understanding landing page conversions, this may not be the right fit.\n\nPlease start your proposal with the words “Lancaster Ave” so I know you read the full posting. Proposals without it will not be considered.<\/div><h3>Its screening questions<\/h3><ol class=\"qs\"><li>Describe a Google Ads campaign you personally managed for a U.S. local service business. What type of business was it, and what was the cost per lead?<\/li><li>For a local event space in West Philadelphia, what campaign type, keyword match types, and location settings would you use, and why?<\/li><li>How will you track calls, form submissions, and which leads actually turn into bookings?<\/li><li>If after two weeks we have clicks but no leads, what would you check first?<\/li><li>Have you built landing pages in HighLevel (GoHighLevel)? How do you approach improving a landing page&#x27;s conversion rate?<\/li><\/ol><p><a class=\"ext\" href=\"https://www.upwork.com/jobs/~022115801934686268561\" target=\"_blank\" rel=\"noopener\">Open the post on Upwork ›<\/a><\/p>"], ["lancer", "Lancer (before)", "<div class=\"verdict ok\">Lancer bid on this job<\/div><p class=\"say\">Lancer's AI rated the job <b>80 of 100<\/b> against Will's profile, and gave this reason:<\/p><blockquote>The job aligns perfectly with William&#x27;s core services in Google Ads management, local lead generation, and landing page optimization. He has explicit experience with GoHighLevel and WordPress, both of which are mentioned in the job requirements.<\/blockquote><p class=\"say\"><b>What happened:<\/b> the client did not open the proposal and did not reply. The bid cost $2.40 in Connects.<\/p>"], ["now", "Now (the brain)", "<div class=\"verdict bad\">The brain would skip this job<\/div><p class=\"say\">The rule that skips it:<\/p><ul class=\"why\"><li><b>Client refuses agencies.<\/b> The job's Upwork setting asks for independent freelancers, not agencies.<\/li><\/ul>"]]}, {"ref": "2117377697576544357", "title": "Meta and Google Ads Expert for Doctors", "kicker": "Lancer bid · the brain skips", "tabs": [["post", "The job post", "<div class=\"ptext\">We are a marketing agency working with doctors and need a freelancer to help drive traffic to clinics through Google search and Meta ads. The right candidate should be able to create and manage campaigns, improve targeting, and increase clinic visits from searchers. Experience supporting healthcare-related clients is a plus. We’re looking for someone who can help improve performance, optimize campaigns, and deliver measurable results for our clients.<\/div><p><a class=\"ext\" href=\"https://www.upwork.com/jobs/~022117377697576544357\" target=\"_blank\" rel=\"noopener\">Open the post on Upwork ›<\/a><\/p>"], ["lancer", "Lancer (before)", "<div class=\"verdict ok\">Lancer bid on this job<\/div><p class=\"say\">Lancer's AI rated the job <b>80 of 100<\/b> against Will's profile, and gave this reason:<\/p><blockquote>The job aligns perfectly with William&#x27;s core services in Google and Meta Ads management, and his experience includes working with the healthcare and wellness industries.<\/blockquote><p class=\"say\"><b>What happened:<\/b> Lancer's lead export has no result for this bid yet.<\/p>"], ["now", "Now (the brain)", "<div class=\"verdict bad\">The brain would skip this job<\/div><p class=\"say\">The rule that skips it:<\/p><ul class=\"why\"><li><b>Client is an agency.<\/b> Jev reads the post as an agency that hires for its own clients (0.98 of 1).<\/li><\/ul>"]]}, {"ref": "2113362238451629049", "title": "GoHighLevel Expert Needed - CRM Setup, Facebook Lead Funnels & Automation", "kicker": "Lancer bid · the brain skips", "tabs": [["post", "The job post", "<div class=\"ptext\">I&#x27;m looking for an experienced GoHighLevel specialist to build and automate my CRM for my mortgage protection life insurance business.  I am an independent life insurance agent.  My primary source of leads will be Facebook advertising.<\/div><h3>Its screening questions<\/h3><ol class=\"qs\"><li>Describe your recent experience with similar projects<\/li><\/ol><p><a class=\"ext\" href=\"https://www.upwork.com/jobs/~022113362238451629049\" target=\"_blank\" rel=\"noopener\">Open the post on Upwork ›<\/a><\/p>"], ["lancer", "Lancer (before)", "<div class=\"verdict ok\">Lancer bid on this job<\/div><p class=\"say\">Lancer's AI rated the job <b>80 of 100<\/b> against Will's profile, and gave this reason:<\/p><blockquote>The job aligns with William&#x27;s expertise in GoHighLevel, CRM setup, and lead generation for service-based businesses like insurance. It falls within his core service offerings of ad management and automation implementation.<\/blockquote><p class=\"say\"><b>What happened:<\/b> the client opened the proposal and replied. The bid cost $9.30 in Connects.<\/p>"], ["now", "Now (the brain)", "<div class=\"verdict bad\">The brain would skip this job<\/div><p class=\"say\">The rule that skips it:<\/p><ul class=\"why\"><li><b>Fixed price under $500.<\/b> The fixed price is $450.<\/li><\/ul>"]]}, {"ref": "2117740122085615628", "title": "U.S.-Based Technical SEO Expert for Google Indexing Issues", "kicker": "Lancer bid · the brain skips", "tabs": [["post", "The job post", "<div class=\"ptext\">We’re looking for a senior technical SEO specialist based in the United States to diagnose Google indexing problems on a local-services directory and help us resolve the underlying causes.\n\nThe site includes business profiles, location pages, and editorial content. Important pages are not being indexed as expected. Initial spot checks have included “Crawled - currently not indexed” URLs, but we need a thorough, current diagnosis rather than assumptions about the cause. The business name and website URL will be shared privately with shortlisted candidates.\n\nImportant: substantial work has already been done\nWe have already invested significant time in the site and its technical SEO. Initial checks have covered crawl access, robots directives, sitemaps, HTTP status codes and redirects, server-rendered content, canonical tags, metadata, and structured data. We will share the existing work and findings so you can build on them and independently validate what matters.\n\nThis is a serious, unresolved indexing problem. A generic checklist audit, basic title/meta-tag edits, simply resubmitting a sitemap, or repeatedly requesting indexing will not satisfy this engagement. We need an experienced investigator who can explain what previous work missed, identify specific causes with URL-level evidence, and propose and validate targeted changes. If a basic issue was missed, demonstrate it clearly rather than assuming it.\n\nScope of work\n• Review Google Search Console indexing reports, URL Inspection results, sitemap processing, and representative page types.\n• Investigate crawlability, rendered content, robots directives, canonical selection, redirects/status codes, internal linking, pagination, duplicate or low-value pages, and sitemap accuracy.\n• Separate technical blockers from content-quality, duplication, discovery, or other issues, with evidence for each finding.\n• Deliver a prioritized action plan with affected page types, example URLs, recommended fixes, expected impact, and implementation effort.\n• Help implement approved fixes or provide clear instructions to our developer, then verify the changes.\n• Establish a baseline and a practical monitoring plan to track indexing of priority pages over time. Clearly distinguish completed technical fixes from Google’s indexing decisions.\n\nWhat we’re looking for\n• Deep, hands-on experience solving indexing issues on directories, marketplaces, or other sites with many templated pages.\n• Strong Google Search Console and technical crawling skills, using tools such as Screaming Frog or Sitebulb.\n• Ability to explain what the evidence proves, what remains a hypothesis, and how you would test it.\n• Clear communication and availability for calls during U.S. business hours.\n• You must currently be based in the United States and personally lead the technical work. Please identify anyone else who would be involved.\n\nDeliverables\n1. Evidence-backed diagnosis and prioritized remediation plan.\n2. Approved fixes implemented or documented for our developer, with validation.\n3. A concise follow-up report showing what changed and what still needs monitoring.\n\nWe’d like to begin with a clearly scoped paid diagnostic phase. Please propose your fee or estimated hours for that phase and a realistic timeline; any implementation work will be scoped separately.\n\nIn your proposal, please include one or two relevant indexing case studies: the issue, how you diagnosed it, what you changed, and the measured outcome and timeframe. Also outline your first steps for investigating “Crawled - currently not indexed” pages and include your U.S. time zone.\n\nPleas     show(at);
    scrollTo(0, Math.min(y, 120));
    return;
  }
  const b = e.target.closest(".choices button");
  if (b) {
    const i = +b.dataset.i;
    state[i] = { ...(state[i] || {}), v: b.dataset.v };
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    save(); dots(); where();
    console.log("[review] marked", { page: C.key, item: i + 1, ref: L[i].ref, choice: b.dataset.v });
  }
  if (e.target.id === "copy") copy();
});
document.addEventListener("input", e => {
  if (e.target.matches("textarea[data-i]")) { const i = +e.target.dataset.i; state[i] = { ...(state[i] || {}), note: e.target.value }; save(); }
  if (e.target.id === "name") { state.name = e.target.value; save(); }
});
function text() {
  const who = (state.name || "").trim() || "(no name)";
  const lines = [`${C.head}: feedback from ${who}`];
  L.forEach((x, i) => {
    const s = state[i] || {};
    lines.push(`${i + 1}. ${x.title} (${x.ref}): ${s.v ? LABEL[s.v] : "not marked"}`);
    if ((s.note || "").trim()) lines.push(`   ${s.note.trim().replace(/\n+/g, " / ")}`);
  });
  lines.push(`Marked ${marked()} of ${L.length}.`);
  return lines.join("\n");
}
async function copy() {
  const t = text(), done = document.getElementById("done");
  try {
    await navigator.clipboard.writeText(t);
  } catch (e) {
    // Older browsers: copy through a hidden text box.
    const ta = Object.assign(document.createElement("textarea"), { value: t });
    document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
    console.warn("[review] clipboard API failed; used the fallback", e);
  }
  done.textContent = "Copied. Paste it to Will.";
  console.log("[review] feedback copied", { page: C.key, chars: t.length, marked: marked() });
}
const start = parseInt(location.hash.slice(1), 10);
show(Number.isNaN(start) ? 0 : start);
console.log("[review] page ready", { page: C.key, items: L.length });
</script>
